name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          # 把 Kotlin 編譯錯誤變成 GitHub 註記，在 Actions 頁面就看得到
          grep -E "^e: " build.log | sed -E 's#file://[^ ]*/app/src/main/java/##' | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -E "What went wrong" -A 6 build.log | head -30 | while IFS= read -r line; do
            echo "::warning::${line}"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MoneyBook-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MoneyBook-v${{ github.run_number }}
          path: MoneyBook-v${{ github.run_number }}.apk

      - name: Publish to Releases (手機直接下載)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 記帳本 v${{ github.run_number }}
          files: MoneyBook-v${{ github.run_number }}.apk
