name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MoneyBook-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MoneyBook-v${{ github.run_number }}
          path: MoneyBook-v${{ github.run_number }}.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 記帳本 v${{ github.run_number }}
          files: MoneyBook-v${{ github.run_number }}.apk
