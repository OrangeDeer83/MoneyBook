name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: |
          rm -rf src-build && mkdir src-build
          unzip -q MoneyBook-src.zip -d src-build
          ls src-build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: src-build
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        working-directory: src-build
        run: |
          grep -E "^e: " build.log | sed -E 's#file://[^ ]*/app/src/main/java/##' | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -E "What went wrong" -A 8 build.log | head -40 | while IFS= read -r line; do
            echo "::warning::${line}"
          done

      - name: Rename APK
        run: cp src-build/app/build/outputs/apk/debug/app-debug.apk MoneyBook-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MoneyBook-v${{ github.run_number }}
          path: MoneyBook-v${{ github.run_number }}.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 記帳本 v${{ github.run_number }}
          files: MoneyBook-v${{ github.run_number }}.apk
