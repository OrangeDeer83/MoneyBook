name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: |
          rm -rf src-build && mkdir src-build
          unzip -q MoneyBook-src.zip -d src-build

      - name: Read version
        id: ver
        run: |
          V=$(grep -E '^versionName=' src-build/version.properties | cut -d= -f2 | tr -d '\r ')
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "版本：$V"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: src-build
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        working-directory: src-build
        run: |
          grep -E "^e: " build.log | sed -E 's#file://[^ ]*/app/src/main/java/##' | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -E "What went wrong" -A 8 build.log | head -40 | while IFS= read -r line; do
            echo "::warning::${line}"
          done

      - name: Rename APK
        run: cp src-build/app/build/outputs/apk/debug/app-debug.apk "MoneyBook-v${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MoneyBook-v${{ steps.ver.outputs.name }}-build${{ github.run_number }}
          path: MoneyBook-v${{ steps.ver.outputs.name }}.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: 記帳本 v${{ steps.ver.outputs.name }}
          body_path: src-build/RELEASE_NOTES.md
          files: MoneyBook-v${{ steps.ver.outputs.name }}.apk
          overwrite_files: true
          make_latest: true
