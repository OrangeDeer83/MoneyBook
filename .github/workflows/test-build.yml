name: Test Build

# 私下測試用：只編譯 debug 版並存成附件，不會發布 Release。
# push 到 dev 分支，或到 Actions 頁面手動執行（可選任何分支）就會觸發。
on:
  push:
    branches: [ dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'ci/**'
      - '.github/workflows/ui-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::沒有簽章金鑰，測試版會用臨時金鑰，無法覆蓋安裝舊的測試版"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E "^e: " build.log | sed -E 's#file://[^ ]*/app/src/main/java/##' | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -E "What went wrong" -A 8 build.log | head -40 | while IFS= read -r line; do
            echo "::warning::${line}"
          done

      - name: Name the APK
        id: name
        run: |
          V=$(grep -E '^versionName=' version.properties | cut -d= -f2 | tr -d '\r ')
          # 版本-dev-月日-時分-commit 前 7 碼，例如 MoneyBook-3.1.0-dev-1001-1530-be2f7fc
          N="MoneyBook-${V}-dev-$(TZ=Asia/Taipei date +%m%d-%H%M)-${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "$N.apk"
          echo "name=$N" >> "$GITHUB_OUTPUT"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ steps.name.outputs.name }}.apk
          retention-days: 14
