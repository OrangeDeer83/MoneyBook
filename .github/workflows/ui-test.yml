name: UI Test

# 畫面自動測試：在 CI 開 Android 模擬器，安裝 debug 版，照腳本操作並截圖。
# 結果（截圖與報告）存成附件，不會發布 Release。
# 修改 ci/ 底下的檔案並 push 到 dev，或手動執行就會觸發。
on:
  push:
    branches: [ dev ]
    paths:
      - 'ci/**'
      - '.github/workflows/ui-test.yml'
  workflow_dispatch:
    inputs:
      api:
        description: 'Android API 版本'
        default: '35'

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api || '35' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put secure show_ime_with_hard_keyboard 0
            mkdir -p out
            cd ci/ui && OUT=../../out python3 flow_reimb_late_amount.py

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-result
          path: out
          retention-days: 14
