name: UI Test

# 畫面自動測試：在 CI 開 Android 模擬器，安裝 debug 版，依腳本自動操作並截圖，最後合併成一份含截圖的報告。
# 結果存成附件，不會發布 Release。
# 只能手動執行（Actions 頁面，或 gh workflow run ui-test.yml --ref dev）：
#   不填 only：跑全部用例（a、b、c、d 四個分流，約 30 分鐘）
#   填 only：只跑指定的用例（用例編號或名稱的一部分，逗號分隔，例如 TC121,更新餘額），一台模擬器，幾分鐘
on:
  workflow_dispatch:
    inputs:
      api:
        description: 'Android API 版本'
        default: '35'
      only:
        description: '只跑這些用例（編號或名稱片段，逗號分隔）；留空跑全部'
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

  ui:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((inputs.only || '') != '' && '["only"]' || '["a","b","c","d"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug

      - name: Python tools
        run: pip3 install --user --break-system-packages pillow || pip3 install --user pillow

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 模擬器快照快取：第一次開機後把快照存起來，之後從快照啟動（約 2 分鐘 → 半分鐘以內）
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ inputs.api || '35' }}-google_apis-x86_64-pixel_6

      - name: Create AVD and snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api || '35' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # 直接用機器上現成的 SDK 啟動快取好的模擬器（emulator-runner 每次會多花約 1 分鐘安裝 SDK 元件）
      - name: Run UI tests on emulator
        env:
          ONLY: ${{ inputs.only }}
        run: |
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          nohup emulator -port 5554 -avd test -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim > emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed | tr -d '')" = "1" ] && break
            sleep 2
          done
          echo "模擬器開機完成（等了約 $((i*2)) 秒）"
          adb shell settings put global window_animation_scale 0.0
          adb shell settings put global transition_animation_scale 0.0
          adb shell settings put global animator_duration_scale 0.0
          OUT=$PWD/out APK=$PWD/app/build/outputs/apk/debug/app-debug.apk bash ci/ui/run_shard.sh ${{ matrix.shard }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.shard }}
          path: out
          retention-days: 7

  report:
    needs: ui
    # 只跑指定用例時不產生完整報告（沒跑的用例會全部顯示成手動），直接看 ui-only 附件裡的 results_only.json
    if: always() && (inputs.only || '') == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ui-*
          path: results
          merge-multiple: true
      - name: Python tools
        run: pip3 install --user --break-system-packages pillow || pip3 install --user pillow
      - name: Build report
        run: python3 ci/ui/build_report.py results report.html
      - uses: actions/upload-artifact@v4
        with:
          name: ui-report
          path: |
            report.html
            report.json
          retention-days: 14
